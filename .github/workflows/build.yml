name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Record build metadata
        run: |
          {
            echo "=== Build Metadata ==="
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.run_number }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "gradle: $(gradle --version | grep Gradle | head -1)"
            echo ""
            echo "=== APK SHA-256 ==="
            sha256sum app/build/outputs/apk/debug/app-debug.apk
          } > build_output.txt
          cat build_output.txt

      - name: Copy APK to repo root
        run: cp app/build/outputs/apk/debug/app-debug.apk ./xf3-tuner.apk

      - name: Commit APK and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f xf3-tuner.apk build_output.txt
          git commit -m "ci: build artifacts [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xf3-tuner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
