name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          gradle assembleDebug --no-daemon --stacktrace > build_log.txt 2>&1
          echo "exit_code=$?" >> build_log.txt
          tail -100 build_log.txt

      - name: Commit build log
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build_log.txt
          git commit -m "ci: build log [skip ci]" || true
          git push || true

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: XF3Tuner-debug
          path: app/build/outputs/apk/debug/*.apk
