name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.txt

      - name: Copy APK to repo root
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./xf3-tuner.apk
          ls -la xf3-tuner.apk

      - name: Commit APK and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f xf3-tuner.apk build_output.txt || true
          git commit -m "ci: build artifacts [skip ci]" || true
          git push || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xf3-tuner-debug
          path: app/build/outputs/apk/debug/*.apk
